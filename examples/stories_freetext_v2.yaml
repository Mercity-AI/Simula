project:
  name: "stories_freetext_v2"
  output_dir: "runs/stories_freetext_v2"   # FRESH dir — v1 artifacts are from the buggy pre-fix run
  seed: 42

# Free-text mode (schema: null) -> each row is a complete, self-contained short story as a plain
# string. Broad, general-purpose short fiction for fine-tuning a creative-writing model. English only.
#
# V2 CHANGES vs v1 (all domain-level; the library fixes landed separately on main):
#  - The old `pov` factor conflated four dimensions (grammatical person + focalization + delivery
#    medium + structural technique) as siblings. It is SPLIT here into `person` (who narrates + how
#    close) and `medium` (the delivery form: prose vs letters/documents/frame). Because `medium` is a
#    single factor, a story is EITHER plain prose OR epistolary OR documentary OR framed — never a
#    stack of two document gimmicks at once.
#  - `structure` is rewritten to be STRICTLY plot-shape (temporal arrangement of events). It no longer
#    owns frame/document/testimony forms — `medium` does.
#  - Prevalence is written into the factor descriptions as explicit target weights so the taxonomy
#    builder starts near the intended distribution (hand-edit taxonomy.json if it comes back timid).
description: >
  A large, general-purpose dataset of complete, self-contained English short stories for training a
  creative-writing model. Each row is a single finished story written as plain prose — no title, no
  author notes, no meta-commentary, no "here is a story" preamble, just the narrative itself. The set
  spans many genres (literary, science fiction, fantasy, mystery/crime, horror, romance, historical,
  adventure, comedy, slice-of-life, fable/folktale, thriller) and a wide spread of tones, from
  whimsical and hopeful to dark, eerie, and bittersweet. Length varies deliberately and widely:
  many flash pieces (~200-300 words), a solid band of short stories (~600-900 words), and a smaller
  share of medium stories (~800-1400 words) — the prose length must match the intended band.
  The overwhelming majority of stories are conventional narrated prose in a close, ordinary voice
  with a clear arc; unusual forms — second-person address, letters/diaries, documentary/archive
  presentation, framed or nested tales, nonlinear timelines — appear but are deliberately RARE
  seasonings, and a single story never stacks more than one such device. Stories are vivid, specific,
  and emotionally coherent, with concrete detail and a clear voice — never generic filler. All
  content is safe-for-work.

# Free-text: no JSON schema. Records are strings and go through the text critic, not schema validation.
schema: null

# Single provider (OpenRouter); key read only from the project-root .env.
#   echo 'OPENROUTER_API_KEY=...' > .env      (gitignored, auto-loaded)
provider:
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  timeout_seconds: 240

models:
  # DESIGN phase (taxonomy + strategies). This is the ONLY role that makes real calls in a
  # stop_after: strategies run. Kimi K3 fast with medium reasoning (trace excluded — we only need
  # the JSON, not the thinking).
  strategic:
    model: "moonshotai/kimi-k3:fast"
    temperature: 0.7
    max_tokens: 16384
    extra_body: {reasoning: {effort: medium, exclude: true}}
  # META-PROMPT phase (this run). gpt-5.6-luna, low reasoning (trace excluded), pinned to OpenAI's
  # cheaper flex tier via OpenRouter provider routing — pure extra_body pass-through, no code involved.
  # allow_fallbacks:false = fail rather than route off flex.
  bulk:
    model: "openai/gpt-5.6-luna"
    temperature: 1.0
    max_tokens: 16384
    extra_body: {reasoning: {effort: low, exclude: true}, provider: {only: ["openai/flex"], allow_fallbacks: false}}
  # NOT CALLED in a stop_after: meta_prompts run. Pick the real story-gen critic later.
  critic:
    model: "fake"
    temperature: 0.2
    max_tokens: 16384

# Short-and-sweet meta-prompts: overrides only meta_prompt_prompt (seed, not outline). See the module.
prompts:
  module: "stories_freetext_v2_prompts.py"

# depth-2 taxonomy, 7 explicit factors. One leaf per factor is sampled per story. children_per_node
# is 5 so `person` and `medium` can carry their full set of branches. Built once, reused.
taxonomy:
  depth: 2
  factors:
    - name: "genre"
      description: "The fiction genre, narrowing from a broad genre to a sub-genre/mode at the deeper level (e.g. science fiction -> first-contact, cyberpunk, generation-ship; fantasy -> high fantasy, fairy-tale retelling, urban fantasy). Cover broadly and roughly evenly: literary/contemporary, science fiction, fantasy, mystery & crime, horror & the uncanny, romance, historical fiction, adventure, comedy & satire, slice-of-life, fable & folktale, thriller & suspense, magical realism, coming-of-age. No single genre should dominate; weight the branches fairly evenly."
    - name: "tone"
      description: "The emotional register and mood of the piece, from the overall feeling down to a specific shade (e.g. hopeful -> quietly redemptive; dark -> dread-soaked; comedic -> deadpan/absurd). Cover roughly evenly: whimsical, hopeful/uplifting, melancholic, bittersweet, tense/suspenseful, dark/grim, eerie/unsettling, comedic/absurd, wistful/nostalgic, warm/tender, satirical/wry, contemplative."
    - name: "length"
      description: "The intended length band of the story, which the prose must actually match. Levels narrow from band to a rough word target: flash (~200-300 words: a single image, moment, or turn), short (~600-900 words: one scene with a small arc), medium (~800-1400 words: multiple beats, a fuller arc). Realistic prevalence (weight the branches accordingly): flash is very common (weight ~0.9), short is very common (weight ~0.9), medium is a smaller share (weight ~0.4)."
    - name: "person"
      description: "The grammatical person and focalization of the narration — WHO tells the story and how close the lens sits. This factor is ONLY about person and focalization; it says nothing about the delivery form (letters, transcripts, framed tales — that is the `medium` factor) or the plot's shape in time (that is the `structure` factor). Cover, with realistic prevalence written as target weights: close/limited third person is the everyday workhorse and by far the most common (weight ~1.0); first person is common (weight ~0.6); third-person omniscient is moderate (weight ~0.3); rotating / multi-focal limited third is uncommon (weight ~0.12); second person is RARE (weight ~0.04). Do NOT subdivide the rare branches (especially second person) more finely than the common ones — granularity must not become prevalence."
    - name: "medium"
      description: "The delivery medium of the narrative — HOW the story reaches the reader on the page. Is it ordinary narrated scene-and-summary prose, or is it presented as documents/artifacts or a framed telling? Cover, with realistic prevalence written as target weights: conventional narrated scene prose overwhelmingly dominates (weight ~1.0); epistolary (letters, diary entries, messages) is rare (weight ~0.05); documentary/archive (transcripts, reports, case files, found records, footnotes) is rare (weight ~0.04); mixed/frame form (a story-within-a-story, a nested or framed telling) is rare (weight ~0.04); other experimental forms (list, mosaic/collage, hybrid) are very rare (weight ~0.02). Conventional prose must be the default the great majority of the time; the non-prose forms are occasional seasonings, never staples. Do NOT subdivide the rare branches more finely than conventional prose."
    - name: "structure"
      description: "The SHAPE OF THE PLOT IN TIME — how the events are ordered and how the arc resolves. This factor is strictly about temporal/plot arrangement; it says NOTHING about who narrates (`person`) or the delivery form (`medium`). Cover: a clean rising arc with resolution (the common default, weight ~1.0); a twist / reveal that recontextualizes what came before (weight ~0.5); an in-media-res opening that starts mid-action (weight ~0.5); a circular structure that returns to its opening (weight ~0.35); a vignette / unresolved slice-of-life (weight ~0.4); nonlinear / interleaved timelines (uncommon, weight ~0.2). IMPORTANT: do NOT create branches for document forms, frame or nested narration, epistolary, testimony, or archive — those are narrative MEDIUM and belong to the `medium` factor, not here. Keep every branch a pure temporal/plot arrangement."
    - name: "setting"
      description: "The concrete world the story inhabits — time period and place/milieu — narrowing from a broad setting to a specific locale (e.g. historical-past -> medieval village, industrial-era factory town, wartime home front; far-future -> orbital colony, terraformed frontier, post-collapse wasteland). Cover broadly and orthogonally to genre so worlds don't collapse into cliché (not every fantasy medieval-European, not every sci-fi a spaceship): contemporary-urban, rural/small-town, historical-past, near-future, far-future, secondary/invented world, and liminal/domestic interiors (a single room, a car, a threshold). Vary geography and culture, not just era; weight the branches fairly evenly."
  best_of_n: 2
  review_mode: "auto_accept"
  children_per_node: 5

# Steer the strategy build. The critical instruction is the CONSTRAINT BUDGET: keep the plain,
# conventional story the common case and dilute the rare forms ACROSS strategies rather than
# concentrating them into one "experimental" lane (the v1 mistake).
strategy:
  # count left at the model's default (2-5).
  guidance: >
    Cover all genres, tones, and settings broadly and evenly rather than over-weighting a few popular
    ones; recombine settings against genres so worlds don't fall into cliché (not every fantasy
    medieval-European, not every sci-fi a spaceship). Spread the length factor widely toward flash and
    short, and make the prose length actually match the band.
    CONSTRAINT BUDGET — this is the most important rule: the typical story is conventional narrated
    prose (medium), in close third or first person (person), with a clear arc (structure). The unusual
    forms — second person, epistolary, documentary/archive, framed/nested telling, nonlinear timelines
    — are rare seasonings. At most ONE unusual formal device per story. NEVER build a strategy that
    makes an experimental medium, person, or structure mandatory, and NEVER concentrate the
    experimental forms together into a single lane — dilute them thinly across strategies so any given
    rare form shows up occasionally and mostly alongside otherwise-ordinary choices. Flash pieces in
    particular should carry essentially no extra formal device.
    Prize vivid, specific, emotionally coherent stories with a distinct voice over safe, generic ones.

# --- RUN NOTE ---------------------------------------------------------------------------------------
# This run is DESIGN-ONLY: it builds taxonomy.json + strategies.json and halts (stop_after:
# strategies). No stories, no meta-prompts, no bulk/critic calls. Only the strategic (kimi) role
# spends money. Workflow:
#   1) python -m simula.cli validate examples/stories_freetext_v2.yaml     # free
#   2) python -m simula.cli taxonomy examples/stories_freetext_v2.yaml     # builds taxonomy.json
#   3) python -m simula.cli generate examples/stories_freetext_v2.yaml     # builds strategies.json, stops
#   4) inspect taxonomy.json + strategies.json by hand; hand-edit weights / add never_combine; rerun
# Before any meta-prompt / story run later: swap bulk+critic to the real story-writer model, add the
# prompts.module override (short meta-prompts + compressed writer system prompt), set complexity_ratio
# as decided, and change stop_after to meta_prompts.
generation:
  target_size: 20000           # => ceil(20000*1.3) = 26000 meta-prompt attempts
  overgenerate_ratio: 1.3
  meta_prompts_per_mix: 1      # one meta-prompt per sampled mix; every meta-prompt written becomes a story
  complexity_ratio: 0.0        # complexify fights the short-and-sweet meta-prompt goal; off for fiction
  max_refine_attempts: 1
  concurrency: 64
  checkpoint_every: 100
  stop_after: meta_prompts     # generate meta_prompts.jsonl, then halt (no stories in this run)

evaluation:
  dedupe: true
  coverage: true
  coverage_mode: "lineage"
  complexity: false
  diversity:
    enabled: false
    text_field: null
