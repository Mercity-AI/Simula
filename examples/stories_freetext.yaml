project:
  name: "stories_freetext"
  output_dir: "runs/stories_freetext"
  seed: 42

# Free-text mode (schema: null) -> each row is a complete, self-contained short story as a plain
# string, not a JSON object. Broad, general-purpose short fiction for fine-tuning a creative-writing
# model: many genres, tones, lengths, points of view, and narrative structures. English only.
description: >
  A large, general-purpose dataset of complete, self-contained English short stories for training a
  creative-writing model. Each row is a single finished story written as plain prose — no title, no
  author notes, no meta-commentary, no "here is a story" preamble, just the narrative itself. The set
  spans many genres (literary, science fiction, fantasy, mystery/crime, horror, romance, historical,
  adventure, comedy, slice-of-life, fable/folktale, thriller) and a wide spread of tones, from
  whimsical and hopeful to dark, eerie, and bittersweet. Length varies deliberately and widely:
  many flash pieces (~200-300 words), a solid band of short stories (~600-900 words), and a meaningful
  share of medium stories (~800-1400 words) — the prose length should match the intended length band.
  Point of view varies (first person, close third, omniscient third, second person, epistolary) and
  so does narrative structure (a clean arc, a twist ending, in-media-res, a frame story, a circular
  return, an unresolved slice of life). Stories are vivid, specific, and emotionally coherent, with
  concrete detail and a clear voice — never generic filler. All content is safe-for-work.

# Free-text: no JSON schema. Records are strings and go through the text critic, not schema validation.
schema: null

# DeepSeek v4 via OpenRouter (single provider; key read only from the project-root .env). Reasoning is
# explicitly excluded per role (effort low, exclude true) — cheaper, faster, clean prose out. There is
# no model-id auto-detection in this build, so extra_body must be set on every role. Add the key with:
#   echo 'OPENROUTER_API_KEY=...' > .env      (gitignored, auto-loaded)
provider:
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  timeout_seconds: 240

models:
  # Design phase only: builds the taxonomy + strategies once (reused after). Medium reasoning for a
  # thoughtful tree/strategy. temperature 1.0 — GPT-5-series reasoning models fix temp at the default.
  strategic:
    model: "openai/gpt-5.6-terra"
    temperature: 1.0
    max_tokens: 16384
    # Pin to OpenAI's flex endpoint only (cheaper tier). allow_fallbacks:false = fail rather than
    # route off OpenAI. Flex has no default-tier fallback, so a flex capacity error surfaces as a retry.
    extra_body: {reasoning: {effort: medium, exclude: true}, provider: {only: ["openai/flex"], allow_fallbacks: false}}
  # Bulk (this run = meta-prompts only, since we stop_after: meta_prompts). Low reasoning, temp 1.0 for
  # prompt diversity. NOTE: whatever writes the actual STORIES later can be a different/cheaper model.
  bulk:
    model: "openai/gpt-5.6-luna"
    temperature: 1.0
    max_tokens: 16384
    extra_body: {reasoning: {effort: low, exclude: true}, provider: {only: ["openai/flex"], allow_fallbacks: false}}
  # Critic: NOT called in a stop_after: meta_prompts run. Left as-is; pick the real story-gen critic later.
  critic:
    model: "deepseek/deepseek-v4-flash"
    temperature: 0.2
    max_tokens: 16384
    extra_body: {reasoning: {effort: low, exclude: true}}

# depth-2 taxonomy with 5 explicit factors. One node per factor is sampled per story, so the mix space
# is genre x tone x length x pov x structure -- far more unique combinations than 20k rows, giving the
# coverage-aware trim plenty to balance from without the build cost of a deeper tree. Built once, reused.
taxonomy:
  depth: 2
  factors:
    - name: "genre"
      description: "The fiction genre, narrowing from a broad genre to a sub-genre/mode at the deeper level (e.g. science fiction -> first-contact, cyberpunk, generation-ship; fantasy -> high fantasy, fairy-tale retelling, urban fantasy). Cover broadly: literary/contemporary, science fiction, fantasy, mystery & crime, horror & the uncanny, romance, historical fiction, adventure, comedy & satire, slice-of-life, fable & folktale, thriller & suspense, magical realism, coming-of-age."
    - name: "tone"
      description: "The emotional register and mood of the piece, from the overall feeling down to a specific shade (e.g. hopeful -> quietly redemptive; dark -> dread-soaked; comedic -> deadpan/absurd). Cover: whimsical, hopeful/uplifting, melancholic, bittersweet, tense/suspenseful, dark/grim, eerie/unsettling, comedic/absurd, wistful/nostalgic, warm/tender, satirical/wry, contemplative."
    - name: "length"
      description: "The intended length band of the story, which the prose must actually match. Levels narrow from band to a rough word target: flash (~200-300 words: a single image, moment, or turn), short (~600-900 words: one scene with a small arc), medium (~800-1400 words: multiple beats, a fuller arc). Spread the dataset across all three, weighted toward flash and short."
    - name: "pov"
      description: "The narrative point of view and voice, narrowing from the person to its handling (e.g. first person -> unreliable narrator, retrospective; third person -> close/limited, omniscient). Cover: first-person, close/limited third, omniscient third, second-person, epistolary/documentary (letters, diary, transcript)."
    - name: "structure"
      description: "The shape of the narrative, from the overall structure to a specific device (e.g. arc -> quiet epiphany; twist -> reframe of everything prior). Cover: clean rising-arc-and-resolution, twist/reveal ending, in-media-res opening, frame story (story-within-a-story), circular/returns-to-the-start, vignette/unresolved slice-of-life, nonlinear/interleaved timelines."
    - name: "setting"
      description: "The concrete world the story inhabits — time period and place/milieu — narrowing from a broad setting to a specific locale (e.g. historical-past -> medieval village, industrial-era factory town, wartime home front; far-future -> orbital colony, terraformed frontier, post-collapse wasteland). Cover broadly and orthogonally to genre so worlds don't collapse into cliché (not every fantasy medieval-European, not every sci-fi a spaceship): contemporary-urban, rural/small-town, historical-past, near-future, far-future, secondary/invented world, and liminal/domestic interiors (a single room, a car, a threshold). Vary geography and culture, not just era."
  best_of_n: 2
  review_mode: "auto_accept"
  children_per_node: 4

# Steer the strategy build toward even, broad coverage rather than defaulting to a few popular genres,
# and toward the wide length spread the length factor defines (the story's word count must track its band).
strategy:
  guidance: >
    Cover all genres and tones broadly and evenly rather than over-weighting a few popular ones (don't
    let the set collapse into mostly literary or mostly fantasy). Spread the length factor widely so the
    dataset spans the full range: many flash pieces, a large band of short stories, and a meaningful
    share of medium stories — and make the prose length actually match the intended band. Vary point of
    view, narrative structure, and setting freely across all genres — recombine settings against genres
    so worlds don't fall into cliché (avoid every fantasy being medieval-European or every sci-fi a
    spaceship). Prize vivid, specific, emotionally coherent stories with a distinct voice over safe,
    generic ones.

# --- SCALE NOTE -------------------------------------------------------------------------------------
# This ships pointed at the full 20k target. Before spending real money, run it small first:
#   1) python -m simula.cli validate examples/stories_freetext.yaml        # no model calls
#   2) temporarily set all three model roles to "fake" and `run` it        # free, offline smoke
#   3) restore the real models, drop target_size to ~30, run `taxonomy` then `generate`, eyeball quality
#   4) restore target_size: 20000 and run `generate` in the SAME output_dir (taxonomy/strategies/pilot
#      rows are reused via resume). Keep the fingerprinted knobs below (meta_prompts_per_mix,
#      complexity_ratio, max_refine_attempts) CONSTANT across that bump, or resume aborts.
# Lower `concurrency` if the provider rate-limits; raise `overgenerate_ratio` if the pilot accept rate
# is low (final can silently land below target if too many rows are rejected — check dataset.raw.jsonl).
generation:
  target_size: 20000           # full run: attempts = ceil(20000 * 1.3) = 26000 meta-prompts
  overgenerate_ratio: 1.3      # attempts = ceil(target_size * 1.3); buffer for rejected stories
  meta_prompts_per_mix: 1      # one meta-prompt per sampled mix; every meta-prompt written becomes a story
  complexity_ratio: 0.3        # ~30% of points routed through the complexify step for richer constraints
  max_refine_attempts: 1       # critic -> refine at most once before rejecting
  concurrency: 48              # in-flight calls; lower if rate-limited
  checkpoint_every: 100
  # Halt after meta_prompts.jsonl is written so the prompts can be eyeballed/edited before any story
  # is generated; rerun (or `--stop-after none`) to continue. NOTE: the meta-prompt phase spends one
  # bulk call PER ATTEMPT, so at target_size 20000 this writes ~26k prompts before stopping. To QA
  # cheaply, drop target_size to ~30 first; scale back to 20000 only once the prompts look right.
  stop_after: meta_prompts

evaluation:
  dedupe: true                 # n-gram dedupe matters at 20k — drops near-duplicate stories
  coverage: true
  coverage_mode: "lineage"
  complexity: false
  # Embedding diversity is genuinely useful for a story set (catches semantic near-dupes n-gram misses),
  # but needs the extra dep: pip install 'simula[diversity]'. Flip enabled: true to use it.
  diversity:
    enabled: false
    text_field: null           # free-text records are plain strings, so the whole story is embedded
