[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simula-gen"
version = "0.2.0"
description = "Schema-driven synthetic data generator inspired by reasoning-first taxonomy coverage."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "jsonschema>=4.22.0",
  "openai>=1.50.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
  "rich>=13.0.0",
]

[project.urls]
Documentation = "https://simula.readthedocs.io/en/latest/"
Source = "https://github.com/Mercity-AI/Simula"

[project.optional-dependencies]
diversity = [
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "sentence-transformers>=2.7.0",
]
hub = [
  "huggingface_hub>=0.25.0",
]
dev = [
  "simula-gen[diversity]",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
simula = "simula.cli:main"

[tool.setuptools.packages.find]
include = ["simula*"]
